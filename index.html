<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: 把下面两行里的信息改成你自己的 -->
  <title>He Jian</title>
  <meta name="author" content="He Jian" />
  <meta name="description" content="Personal homepage of He Jian." />
  <style>
    :root {
      --text: #1f2328;
      --muted: #57606a;
      --line: #d0d7de;
      --accent: #0969da;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino,
        "Songti SC", Georgia, serif;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 4px;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 0 28px;
    }
    .meta {
      list-style: none;
      margin: 0 0 32px;
      padding: 0;
      font-size: 1rem;
    }
    .meta li { margin: 6px 0; }
    .meta a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .15s ease;
    }
    .meta a:hover { border-bottom-color: var(--accent); }
    .meta .label {
      display: inline-block;
      width: 88px;
      color: var(--muted);
    }
    hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 32px 0;
    }
    footer {
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 480px) {
      main { padding: 56px 20px 40px; }
      h1 { font-size: 1.9rem; }
      .meta .label { width: 72px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>He Jian</h1>
    <p class="tagline">Personal Homepage</p>

    <ul class="meta">
      <!-- TODO: 把下面邮箱替换为你注册 OpenReview 时使用的真实邮箱 -->
      <li><span class="label">Email</span> <a href="mailto:hejian@example.com">hejian@example.com</a></li>
    </ul>

    <hr />

    <footer>
      <p>&copy; <span id="year"></span> He Jian. Hosted on GitHub Pages.</p>
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
